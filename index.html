<!DOCTYPE html>
<html>
<head>

<title>ToyJoy Pro Test Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

header{
background:black;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.hero{
background:#222;
color:white;
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:42px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:40px;
}

.product{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
text-align:center;
}

.product img{
width:100%;
border-radius:8px;
}

.price{
color:red;
font-weight:bold;
}

button{
background:black;
color:white;
padding:10px 15px;
border:none;
cursor:pointer;
margin:5px;
}

button:hover{
background:#444;
}

.checkout{
position:fixed;
bottom:20px;
right:20px;
background:red;
color:white;
padding:15px 25px;
border-radius:30px;
cursor:pointer;
}

.lead-box{
background:white;
margin:40px;
padding:30px;
border-radius:10px;
text-align:center;
}

input{
padding:10px;
margin:10px;
width:250px;
}

footer{
background:black;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

<script>

window.dataLayer = window.dataLayer || [];

function viewItem(product){

dataLayer.push({
event:"view_item",
product_name:product
});

}

function addToCart(product){

dataLayer.push({
event:"add_to_cart",
product_name:product
});

alert(product + " added to cart");

}

function beginCheckout(){

dataLayer.push({
event:"begin_checkout"
});

alert("Checkout started");

}

function purchase(){

dataLayer.push({
event:"purchase",
value:999,
currency:"INR"
});

alert("Purchase event fired");

}

function whatsappClick(){

dataLayer.push({
event:"whatsapp_click"
});

window.open("https://wa.me/919999999999");

}

function leadSubmit(){

dataLayer.push({
event:"generate_lead"
});

alert("Lead captured");

}

</script>

</head>

<body>

<header>

<h2>ToyJoy Test Store</h2>

<div>

<button onclick="whatsappClick()">WhatsApp</button>

</div>

</header>

<section class="hero">

<h1>Anime Streetwear T-Shirts</h1>

<p>Testing Store for Ads & Tracking</p>

</section>

<section class="products">

<div class="product">

<img src="https://via.placeholder.com/300">

<h3>Anime Street Tee</h3>

<p class="price">₹899</p>

<button onclick="viewItem('Anime Street Tee')">View</button>

<button onclick="addToCart('Anime Street Tee')">Add to Cart</button>

</div>

<div class="product">

<img src="https://via.placeholder.com/300">

<h3>Tokyo Oversized Tee</h3>

<p class="price">₹999</p>

<button onclick="viewItem('Tokyo Oversized Tee')">View</button>

<button onclick="addToCart('Tokyo Oversized Tee')">Add to Cart</button>

</div>

<div class="product">

<img src="https://via.placeholder.com/300">

<h3>Dragon Power Tee</h3>

<p class="price">₹1099</p>

<button onclick="viewItem('Dragon Power Tee')">View</button>

<button onclick="addToCart('Dragon Power Tee')">Add to Cart</button>

</div>

</section>

<div class="lead-box">

<h2>Email Discount</h2>

<p>Enter email to get 10% off</p>

<input type="email" placeholder="Enter Email">

<br>

<button onclick="leadSubmit()">Get Discount</button>

</div>

<div class="checkout" onclick="beginCheckout()">

Checkout

</div>

<div style="text-align:center;margin-top:20px">

<button onclick="purchase()">Complete Purchase</button>

</div>

<footer>



</footer>

</body>

</html>
